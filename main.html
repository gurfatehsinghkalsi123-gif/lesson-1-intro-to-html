<body>
    <h1>HTML Basics</h1>
    <p>HTML <br><br> stands for Hyper Text Markup Language. It is the standard markup language for creating web pages and web applications. HTML describes the structure of a web page semantically and originally included cues for the appearance of the document.</p>
     
    <!-- <p>HTML is written in the form of HTML elements consisting of tags enclosed in angle brackets (like <html>) and content inserted between the opening and closing tags. HTML tags most commonly come in pairs like <h1> and </h1>, although some tags are self-closing, for example <img />. Browsers do not display the HTML tags, but use them to render the content of the page.</p> -->
</body>
